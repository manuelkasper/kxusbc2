name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'programmer/package-lock.json'

      - name: Install dependencies
        working-directory: ./programmer
        run: npm ci

      - name: Build project
        working-directory: ./programmer
        run: npm run build

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Build documentation
        working-directory: ./docs
        run: uv run --frozen zensical build --clean

      - name: Add documentation to Pages artifact
        run: cp -R docs/site programmer/dist/docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'programmer/dist'

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4